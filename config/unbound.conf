server:
    interface: 0.0.0.0
    port: 53

    username: "unbound"
    directory: "/etc/unbound"

    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    prefetch: yes
    prefetch-key: yes

    qname-minimisation: yes

    hide-identity: yes
    hide-version: yes

    harden-glue: yes
    harden-dnssec-stripped: yes

    cache-min-ttl: 300
    cache-max-ttl: 86400

    root-hints: "/etc/unbound/root.hints"
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

remote-control:
    control-enable: no